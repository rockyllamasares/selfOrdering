<div class="container">
  <img [src]="food.imageUrl" [alt]="food.name" />

  <div class="details">
    <div class="header">
      <span class="name">
        {{ food.name }}
      </span>
    </div>
    <div class="price">
      <span>{{ food.price }}</span>
    </div>
    <p>
      <button class="button1" onclick="history.back()">Go Back</button>
      <button (click)="addToCart()">Add To Cart</button>
    </p>
  </div>
</div>
