<div class="nav">
<app-headertop></app-headertop>
<app-header></app-header>
</div>
<ul>
    <li *ngFor="let food of foods">
        <div class="wrapper">
        <a routerLink="/food/{{food.id}}">
            <img src="{{food.imageUrl}}" alt="">
            <div class="content">
                <div class="name">
                    {{food.name}}
                </div>
                <div class="price">
                    <span>{{food.price}}</span>
                </div>
            </div>
        </a>
    </div>
    </li>
</ul>
